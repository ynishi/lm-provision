[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app (no powershell: it only
# serves the Windows target this workspace does not build)
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# x86_64-unknown-linux-musl is the pod-side deployment target (spec 08
# §Stability: static-binary embeddability, musl x86_64 baseline) — the
# artifact `driver apply` pushes to a machine.
# No Windows: the pod-side chunked writer is built on unix positioned
# writes (std::os::unix::fs::FileExt), so the workspace has never
# compiled there — the first tagged run proved it [measured:
# 2026-08-30, run 33300554001, E0433 on x86_64-pc-windows-msvc].
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Where to host releases
hosting = "github"
