[package]
name = "lm-provision-mcp"
description = "MCP server exposing lm-provision (validate / hash / plan) and the push-driver apply ledger as MCP tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lm-provision-mcp"
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "lm_provision_mcp"
path = "src/lib.rs"

# A library. Serving it is `lm-provision mcp`, a subcommand of the
# operator CLI (`lm-provision-cli`), rather than a binary of its own:
# one command for an operator to install, and one place the MCP
# server's startup is written.
[dependencies]
lm-provision = { workspace = true }
lm-provision-driver = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
dsl-kit = { workspace = true }
dsl-kit-mcp = { workspace = true }
dsl-kit-parse = { workspace = true }
dsl-kit-schema = { workspace = true }
async-trait = "0.1"
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `tracing` only: this crate emits events (the redaction in `server`
# depends on them being written) but installs no subscriber and defines
# no `main`, so `tracing-subscriber` and `anyhow` left with the binary —
# both now belong to `lm-provision-cli`'s `mcp` subcommand.
tracing = { workspace = true }
