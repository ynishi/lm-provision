[package]
name = "lm-provision-mcp"
description = "MCP server exposing lm-provision (validate / hash / plan) and the push-driver apply ledger as MCP tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lm-provision-mcp"
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "lm_provision_mcp"
path = "src/lib.rs"

[[bin]]
name = "lm-provision-mcp"
path = "src/main.rs"

[dependencies]
lm-provision = { path = "../lm-provision", version = "0.3.0" }
lm-provision-driver = { path = "../lm-provision-driver", version = "0.3.0" }
rmcp = { workspace = true }
tokio = { workspace = true }
dsl-kit = { workspace = true }
dsl-kit-mcp = { workspace = true }
dsl-kit-parse = { workspace = true }
dsl-kit-schema = { workspace = true }
async-trait = "0.1"
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
