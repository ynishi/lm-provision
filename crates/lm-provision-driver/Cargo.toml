[package]
name = "lm-provision-driver"
description = "Push driver for lm-provision: acquire a machine meeting a profile's requirements, run a one-shot SSH session against it (ensure-binary / apply / collect), and record the apply in an append-only ledger"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lm-provision-driver"
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# A library. The operator CLI that drove this crate lives in
# `lm-provision-cli`, whose binary is `lm-provision`: the MCP server
# became a subcommand of that one binary, and the MCP crate depends on
# this one, so the subcommand could not live here without a cycle.
[dependencies]
lm-provision = { workspace = true }
lm-provision-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
dotenvy = { workspace = true }
# No `clap`, `tracing` or `tracing-subscriber`: the argument surface and
# the stderr subscriber left with the binary, and this library writes to
# no stream of its own — what a platform's CLI said comes back in the
# return value (`infra::Listing::said`, `inventory::Fetched::said`) for
# the caller to put somewhere.
# The release-artifact resolver (`provisioner`): download through the core
# crate's one downloader — which is async, hence the runtime — verify
# the published SHA-256, and unpack the `dist` archive. `tar` and
# `lzma-rs` are pure Rust on purpose: the driver itself is shipped for
# five targets including musl, and a C lzma would put a cross toolchain
# in the way of building it.
sha2 = { workspace = true }
tar = { workspace = true }
lzma-rs = { workspace = true }
tokio = { workspace = true }
