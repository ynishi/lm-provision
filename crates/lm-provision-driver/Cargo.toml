[package]
name = "lm-provision-driver"
description = "Push driver for lm-provision: one-shot SSH session (ensure-binary / apply / collect) and append-only apply ledger"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lm-provision-driver"
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "lm-provision-driver"
path = "src/main.rs"

[dependencies]
lm-provision = { path = "../lm-provision", version = "0.4.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
