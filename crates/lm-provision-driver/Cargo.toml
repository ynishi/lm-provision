[package]
name = "lm-provision-driver"
description = "Push driver for lm-provision: acquire a machine meeting a profile's requirements, run a one-shot SSH session against it (ensure-binary / apply / collect), and record the apply in an append-only ledger"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lm-provision-driver"
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "lm-provision-driver"
path = "src/main.rs"

[dependencies]
lm-provision = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
dotenvy = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
