[package]
name = "lm-provision"
description = "Spec-first pod provisioning: Rust host + typed profile AST DSL (static on-pod provisioner)"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lm-provision"
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "lm_provision"
path = "src/lib.rs"

# The binary that lands on a pod and does the work there. Named for
# what it is rather than for its package: `lm-provision` is the command
# an operator types (`lm-provision-cli`), and two different programs
# under one name on one `PATH` is the confusion this rename removes.
# The release asset is still named after the package, so it stays
# `lm-provision-<target>.tar.xz` with `lm-provisioner` inside it.
[[bin]]
name = "lm-provisioner"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
dsl-kit = { workspace = true }
dsl-kit-macros = { workspace = true }
dsl-kit-core = { workspace = true }
dsl-kit-schema = { workspace = true }
dsl-kit-parse = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
