[workspace]
resolver = "2"
members = [
    "crates/lm-provision",
    "crates/lm-provision-cli",
    "crates/lm-provision-driver",
    "crates/lm-provision-mcp",
    "crates/lm-provision-protocol",
    "crates/lm-provision-host",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/lm-provision"
homepage = "https://github.com/ynishi/lm-provision"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["provisioning", "gpu", "runpod", "llm", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# The crates' dependencies on each other. Here rather than in each
# manifest because the version is a literal a bump has to reach —
# Cargo has no spelling that tracks `workspace.package.version` — and
# one place to update beats three to remember.
#
# Getting it wrong is not silent: a requirement that no longer matches
# the version beside it fails to resolve, so a half-done bump does not
# build [measured: 2026-08-12, both directions].
lm-provision = { path = "crates/lm-provision", version = "0.9.0" }
lm-provision-driver = { path = "crates/lm-provision-driver", version = "0.9.0" }
lm-provision-mcp = { path = "crates/lm-provision-mcp", version = "0.9.0" }
lm-provision-protocol = { path = "crates/lm-provision-protocol", version = "0.9.0" }
# There is no `lm-provision-host` entry and there will not be one: it
# is AGPL-3.0-or-later, and no permissive crate here may depend on it
# (`no_permissive_crate_depends_on_the_agpl_host` in that crate makes
# the direction fail a test rather than a review).
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
assert_cmd = "2"
nix = { version = "0.29", default-features = false, features = ["signal", "process", "mount"] }
# Raw Linux syscalls for the sh_egress hard layer (seccomp connect user-notify
# supervisor + SCM_RIGHTS fd passing, `egress::hardpin`). Linux-only use,
# cfg-gated at the call site; the dep itself is harmless on other targets.
libc = "0.2"
# `default-features = false` is load-bearing: reqwest's default TLS backend is
# native-tls (OpenSSL), which breaks the static musl build. rustls only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# `url` is spec 11 §Resolution step 2's `Url::join` — a remote fragment's
# relative import stays same-origin, and same-origin is Url::join. reqwest
# already pulls it in transitively, so this adds no new tree weight; it
# only makes the workspace-level dependency explicit for the code that
# reasons about it directly (`crate::resolve`, the `pin` subcommand).
url = "2"
# The `dist` release archive the driver pushes to a pod is a `.tar.xz`,
# and unpacking one is these two. Pure Rust both: this workspace is
# built for five targets and a C liblzma would make the cross builds
# need a C toolchain each.
tar = "0.4"
lzma-rs = "0.3"
jiff = "0.1"
dotenvy = "0.15"
rmcp = { version = "2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "fs", "time", "signal"] }
schemars = "1"
dsl-kit = "0.11"
dsl-kit-macros = "0.11"
dsl-kit-core = "0.11"
dsl-kit-schema = "0.11"
dsl-kit-parse = "0.11"
dsl-kit-mcp = "0.11"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
