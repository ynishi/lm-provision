[workspace]
resolver = "2"
members = ["crates/lm-provision", "crates/lm-provision-driver", "crates/lm-provision-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/lm-provision"
homepage = "https://github.com/ynishi/lm-provision"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
assert_cmd = "2"
nix = { version = "0.29", default-features = false, features = ["signal", "process", "mount"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
jiff = "0.1"
rmcp = { version = "2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
schemars = "1"
dsl-kit = { path = "../dsl-kit/crates/dsl-kit" }
dsl-kit-macros = { path = "../dsl-kit/crates/dsl-kit-macros" }
dsl-kit-core = { path = "../dsl-kit/crates/dsl-kit-core" }
dsl-kit-schema = { path = "../dsl-kit/crates/dsl-kit-schema" }
dsl-kit-parse = { path = "../dsl-kit/crates/dsl-kit-parse" }
dsl-kit-mcp = { path = "../dsl-kit/crates/dsl-kit-mcp" }
