[workspace]
resolver = "2"
members = ["crates/lm-provision", "crates/lm-provision-driver", "crates/lm-provision-mcp"]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/lm-provision"
homepage = "https://github.com/ynishi/lm-provision"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["provisioning", "gpu", "runpod", "llm", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
assert_cmd = "2"
nix = { version = "0.29", default-features = false, features = ["signal", "process", "mount"] }
# `default-features = false` is load-bearing: reqwest's default TLS backend is
# native-tls (OpenSSL), which breaks the static musl build. rustls only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
jiff = "0.1"
rmcp = { version = "2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "fs", "time", "signal"] }
schemars = "1"
dsl-kit = "0.8"
dsl-kit-macros = "0.8"
dsl-kit-core = "0.8"
dsl-kit-schema = "0.8"
dsl-kit-parse = "0.8"
dsl-kit-mcp = "0.8"
